# Publishes @offerhub/stellar-escrow-signing to npm when its release tag is pushed:
#
#   git tag stellar-escrow-signing-v1.0.0 && git push origin stellar-escrow-signing-v1.0.0
#
# The tag must match the version in packages/stellar-escrow-signing/package.json.
# The job tests the package (wallet kit mocked, no network), builds it, checks the
# tarball and publishes it with npm provenance (this repository is public).
#
# Secret: NPM_TOKEN, an npm automation token with publish rights to the @offerhub scope
# (the same one the API adapters use). A manual run is a dry run: it publishes nothing.
name: Release signing package

on:
  push:
    tags:
      - "stellar-escrow-signing-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/stellar-escrow-signing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/stellar-escrow-signing/package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Check the tag against the package version
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${REF_NAME##*-v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$version" ]; then
            echo "::error::Tag version ${tag_version} does not match package.json (${version})"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test with no network
        run: env -i PATH="$PATH" HOME="$HOME" HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 npm test

      - name: Build
        run: npm run build

      - name: Check the tarball
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('/tmp/pack.json','utf8'))[0].files.map(f => f.path);
            const bad = files.filter(f => /__tests__|\.test\.|^src\//.test(f));
            if (bad.length) { console.error('Unexpected files in the package:', bad); process.exit(1); }
            for (const need of ['LICENSE','README.md','package.json','dist/index.js','dist/index.d.ts']) {
              if (!files.includes(need)) { console.error('Missing from the package:', need); process.exit(1); }
            }
            console.log(files.length + ' files, none unexpected');
          "

      - name: Publish
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
